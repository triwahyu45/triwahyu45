<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 48" width="100%" height="48">
  <defs>
    <linearGradient id="tickerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0c1b"/>
      <stop offset="50%" stop-color="#121733"/>
      <stop offset="100%" stop-color="#0a0c1b"/>
    </linearGradient>

    <linearGradient id="tickerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>
  </defs>

  <style>
    .ticker-container {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .marquee-track {
      display: flex;
      animation: marquee 22s linear infinite;
    }
  </style>

  <!-- Outer Pill Container -->
  <rect x="2" y="2" width="1196" height="44" rx="22" fill="url(#tickerBg)" stroke="url(#tickerBorder)" stroke-width="1.5"/>

  <!-- Left/Right Fade Mask to look slick -->
  <g clip-path="url(#pillClip)">
    <clipPath id="pillClip">
      <rect x="4" y="4" width="1192" height="40" rx="20"/>
    </clipPath>

    <!-- Animated Running Text (SMIL + CSS double fallback) -->
    <g class="ticker-container">
      <text y="30" x="0">
        <animateTransform
          attributeName="transform"
          type="translate"
          from="1200 0"
          to="-2400 0"
          dur="20s"
          repeatCount="indefinite"
        />
        ⚡ AUTONOMOUS MOBILE ROBOTS  •  🤖 DRIVETRAIN KINEMATICS (MECANUM / OMNI / SWERVE)  •  👁️ COMPUTER VISION (YOLOv8 / YOLO11)  •  🛠️ EMBEDDED SYSTEMS (ESP32 / STM32)  •  🥇 JUARA 1 REGIONAL KRTMI 2024  •  🥈 JUARA 2 NASIONAL KRTMI 2024  •  👨‍🏫 PEMBIMBING LKS NASIONAL  •  🌐 3D THREE.JS WEBGL SIMULATORS  •  ⚡ WAHYUAI CYBERPUNK LAB  ⚡
      </text>
    </g>
  </g>

  <!-- Left/Right Neon Indicator Dots -->
  <circle cx="18" cy="24" r="4" fill="#00F5D4"/>
  <circle cx="1182" cy="24" r="4" fill="#EC4899"/>
</svg>
