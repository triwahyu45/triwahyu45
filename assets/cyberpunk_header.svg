<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <!-- Cyberpunk Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050d"/>
      <stop offset="40%" stop-color="#0c0e24"/>
      <stop offset="75%" stop-color="#180d2e"/>
      <stop offset="100%" stop-color="#05050d"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes waveFlow1 {
      0% { d: path("M 0,160 Q 300,120 600,160 T 1200,160 L 1200,240 L 0,240 Z"); }
      50% { d: path("M 0,150 Q 300,180 600,140 T 1200,150 L 1200,240 L 0,240 Z"); }
      100% { d: path("M 0,160 Q 300,120 600,160 T 1200,160 L 1200,240 L 0,240 Z"); }
    }
    @keyframes waveFlow2 {
      0% { d: path("M 0,180 Q 300,150 600,190 T 1200,170 L 1200,240 L 0,240 Z"); }
      50% { d: path("M 0,170 Q 300,200 600,160 T 1200,185 L 1200,240 L 0,240 Z"); }
      100% { d: path("M 0,180 Q 300,150 600,190 T 1200,170 L 1200,240 L 0,240 Z"); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .wave1 {
      animation: waveFlow1 8s ease-in-out infinite;
    }
    .wave2 {
      animation: waveFlow2 6s ease-in-out infinite;
    }
    .title-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: #ffffff;
      text-anchor: middle;
      filter: drop-shadow(0 0 16px rgba(0, 245, 212, 0.7));
    }
    .subtitle-text {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #00F5D4;
      text-anchor: middle;
      filter: drop-shadow(0 0 8px rgba(0, 245, 212, 0.4));
    }
    .grid-line {
      stroke: rgba(56, 189, 248, 0.08);
      stroke-width: 1;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)"/>

  <!-- Cyberpunk Background Grid -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="240" class="grid-line"/>
    <line x1="200" y1="0" x2="200" y2="240" class="grid-line"/>
    <line x1="300" y1="0" x2="300" y2="240" class="grid-line"/>
    <line x1="400" y1="0" x2="400" y2="240" class="grid-line"/>
    <line x1="500" y1="0" x2="500" y2="240" class="grid-line"/>
    <line x1="600" y1="0" x2="600" y2="240" class="grid-line"/>
    <line x1="700" y1="0" x2="700" y2="240" class="grid-line"/>
    <line x1="800" y1="0" x2="800" y2="240" class="grid-line"/>
    <line x1="900" y1="0" x2="900" y2="240" class="grid-line"/>
    <line x1="1000" y1="0" x2="1000" y2="240" class="grid-line"/>
    <line x1="1100" y1="0" x2="1100" y2="240" class="grid-line"/>
    <line x1="0" y1="40" x2="1200" y2="40" class="grid-line"/>
    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line"/>
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line"/>
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line"/>
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line"/>
  </g>

  <!-- Waving Cyberpunk Waves at Bottom -->
  <path class="wave1" fill="url(#waveGrad1)" d="M 0,160 Q 300,120 600,160 T 1200,160 L 1200,240 L 0,240 Z"/>
  <path class="wave2" fill="url(#waveGrad2)" d="M 0,180 Q 300,150 600,190 T 1200,170 L 1200,240 L 0,240 Z"/>

  <!-- Top Accent Neon Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#neonCyan)" filter="url(#glow)"/>

  <!-- Main Title & Subtitle -->
  <text x="600" y="98" class="title-text">TRI WAHYU</text>
  <text x="600" y="142" class="subtitle-text">⚡ MECHATRONICS ENGINEER • ROBOTICS INNOVATOR • AI &amp; VISION DEVELOPER ⚡</text>

  <!-- Decorative Corner Accents -->
  <path d="M 20,20 L 45,20 M 20,20 L 20,45" stroke="#00F5D4" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1180,20 L 1155,20 M 1180,20 L 1180,45" stroke="#EC4899" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 20,220 L 45,220 M 20,220 L 20,195" stroke="#EC4899" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 1180,220 L 1155,220 M 1180,220 L 1180,195" stroke="#00F5D4" stroke-width="2" fill="none" opacity="0.8"/>
</svg>
